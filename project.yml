name: Alfred
options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: com.anirudhlath
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1

packages:
  AlfredKit:
    path: Packages/AlfredKit
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.17.0"

targets:
  Alfred:
    type: application
    platform: iOS
    sources:
      - path: App/Alfred
        excludes:
          - "**/*.xcassets"
    resources:
      - path: App/Alfred/Resources/Assets.xcassets
      - path: App/Alfred/Resources/Info.plist
        buildPhase: none
      - path: App/Alfred/Resources/Alfred.entitlements
        buildPhase: none
    dependencies:
      - package: AlfredKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anirudhlath.alfred
        PRODUCT_NAME: Alfred
        INFOPLIST_FILE: App/Alfred/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Alfred/Resources/Alfred.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: A3PH6PGY29
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ENABLE_PREVIEWS: "YES"
    scheme:
      testTargets:
        - AlfredTests

  AlfredTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/AlfredTests
    dependencies:
      - target: Alfred
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anirudhlath.alfred.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Alfred.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Alfred"
        BUNDLE_LOADER: "$(TEST_HOST)"
