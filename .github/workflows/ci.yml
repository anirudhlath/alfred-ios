name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Test
        # Exclusions below are CI-environment limitations, not app bugs (tracked in
        # docs/backlog/medium/reenable-ci-excluded-tests.md and CLAUDE.md's Testing
        # Gotchas):
        #  - Snapshot tests (4 XCTest classes) are recorded against a specific simulator
        #    device/OS; the macos-15 runner's iPhone 16 doesn't bit-match, so they fail
        #    on image/OS drift rather than a real regression (see CLAUDE.md: "Snapshot
        #    device mismatch").
        #  - KeychainStore round-trip tests (Swift Testing free functions) fail because
        #    CODE_SIGNING_ALLOWED=NO means the test binary has no keychain-access-group
        #    entitlement, so SecItemAdd silently no-ops (KeychainStore doesn't check its
        #    status) and the paired SecItemCopyMatching returns nil. This is a signing
        #    limitation of unsigned CI test runs, not a Keychain logic bug.
        run: |
          xcodebuild test \
            -project Alfred.xcodeproj \
            -scheme Alfred \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skip-testing:AlfredTests/ChatViewSnapshotTests \
            -skip-testing:AlfredTests/NotificationsViewSnapshotTests \
            -skip-testing:AlfredTests/SettingsViewSnapshotTests \
            -skip-testing:AlfredTests/OnboardingSnapshotTests \
            '-skip-testing:AlfredTests/keychainSaveAndLoad()' \
            '-skip-testing:AlfredTests/keychainOverwritesExistingValue()' \
            '-skip-testing:AlfredTests/sessionRepoSavesAndRestoresConfig()' \
            '-skip-testing:AlfredTests/sessionRepoSavesAndRestoresSessionId()' \
            '-skip-testing:AlfredTests/sessionRepoSavesAndRestoresConversationId()' \
            CODE_SIGNING_ALLOWED=NO

  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate conventional PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -qE '^(feat|fix|chore|docs|refactor|test|ci|perf)(\([a-zA-Z0-9._/ -]+\))?!?: .+$'; then
            echo "::error::PR title must be a conventional commit line"; exit 1
          fi
      - name: Not a PR
        if: github.event_name != 'pull_request'
        run: echo "push event"

  ci-ok:
    if: always()
    needs: [swift, pr-title]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": "(failure|cancelled|skipped)"'; then exit 1; fi
